<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BBall Ref Local{% endblock %}</title>
    
    <!-- Tailwind CSS Configuration -->
    <script>
        window.tailwind = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'bball-orange': '#FF6B00',
                        'bball-orange-dark': '#E55A00',
                        'bball-black': '#1A1A1A',
                        'bball-gray': '#2D2D2D',
                    }
                }
            }
        }
    </script>
    
    <!-- Tailwind CSS 4.1.18 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.18/dist/tailwind.min.js"></script>
    
    <!-- HTMX 2.0.8 -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
    
    <!-- Tabulator.js 6.3.1 CSS -->
    <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css">
    
    <!-- Tabulator.js 6.3.1 JS -->
    <script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
    
    <!-- Phosphor Icons 2.1.2 -->
    <script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/custom.css">
    
    <!-- HTMX Indicator CSS -->
    <style>
        /* HTMX Loading Indicator */
        .htmx-indicator {
            opacity: 0;
            transition: opacity 200ms ease-in-out;
        }
        .htmx-request .htmx-indicator {
            opacity: 1;
        }
        .htmx-request.htmx-indicator {
            opacity: 1;
        }
        
        /* Loading spinner */
        .htmx-loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 107, 0, 0.3);
            border-radius: 50%;
            border-top-color: #FF6B00;
            animation: htmx-spin 1s ease-in-out infinite;
        }
        
        @keyframes htmx-spin {
            to { transform: rotate(360deg); }
        }
    </style>
    
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-50 dark:bg-bball-black text-gray-900 dark:text-gray-100 min-h-screen flex flex-col transition-colors duration-200">
    <!-- Navigation Bar -->
    <nav class="bg-white dark:bg-bball-gray shadow-lg border-b-4 border-bball-orange">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <!-- Logo and Desktop Navigation -->
                <div class="flex items-center">
                    <a href="/" class="flex items-center space-x-2 group">
                        <i class="ph-fill ph-basketball text-3xl text-bball-orange group-hover:animate-bounce"></i>
                        <span class="font-bold text-xl hidden sm:block dark:text-white">BBall Ref</span>
                    </a>
                    
                    <!-- Desktop Menu -->
                    <div class="hidden md:flex ml-8 space-x-1">
                        <a href="/" class="nav-link flex items-center px-3 py-2 rounded-md text-sm font-medium text-gray-700 dark:text-gray-300 hover:text-bball-orange hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                            <i class="ph ph-house mr-1.5"></i>
                            Home
                        </a>
                        <a href="/players" class="nav-link flex items-center px-3 py-2 rounded-md text-sm font-medium text-gray-700 dark:text-gray-300 hover:text-bball-orange hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                            <i class="ph ph-users mr-1.5"></i>
                            Players
                        </a>
                        <a href="/teams" class="nav-link flex items-center px-3 py-2 rounded-md text-sm font-medium text-gray-700 dark:text-gray-300 hover:text-bball-orange hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                            <i class="ph ph-shield mr-1.5"></i>
                            Teams
                        </a>
                        <a href="/games" class="nav-link flex items-center px-3 py-2 rounded-md text-sm font-medium text-gray-700 dark:text-gray-300 hover:text-bball-orange hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                            <i class="ph ph-trophy mr-1.5"></i>
                            Games
                        </a>
                        <a href="/stats" class="nav-link flex items-center px-3 py-2 rounded-md text-sm font-medium text-gray-700 dark:text-gray-300 hover:text-bball-orange hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                            <i class="ph ph-chart-bar mr-1.5"></i>
                            Stats
                        </a>
                    </div>
                </div>
                
                <!-- Right side: Dark mode toggle and Mobile menu button -->
                <div class="flex items-center space-x-2">
                    <!-- Dark Mode Toggle -->
                    <button id="darkModeToggle" class="p-2 rounded-lg text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-bball-orange transition-colors" aria-label="Toggle dark mode">
                        <i id="darkModeIcon" class="ph-fill ph-moon text-xl"></i>
                    </button>
                    
                    <!-- Mobile menu button -->
                    <button id="mobileMenuBtn" class="md:hidden p-2 rounded-lg text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-bball-orange transition-colors" aria-label="Open menu">
                        <i id="mobileMenuIcon" class="ph ph-list text-2xl"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Mobile Navigation Menu -->
        <div id="mobileMenu" class="hidden md:hidden bg-white dark:bg-bball-gray border-t dark:border-gray-700">
            <div class="px-2 pt-2 pb-3 space-y-1">
                <a href="/" class="mobile-nav-link flex items-center px-3 py-2 rounded-md text-base font-medium text-gray-700 dark:text-gray-300 hover:text-bball-orange hover:bg-gray-100 dark:hover:bg-gray-700">
                    <i class="ph ph-house mr-3 text-lg"></i>
                    Home
                </a>
                <a href="/players" class="mobile-nav-link flex items-center px-3 py-2 rounded-md text-base font-medium text-gray-700 dark:text-gray-300 hover:text-bball-orange hover:bg-gray-100 dark:hover:bg-gray-700">
                    <i class="ph ph-users mr-3 text-lg"></i>
                    Players
                </a>
                <a href="/teams" class="mobile-nav-link flex items-center px-3 py-2 rounded-md text-base font-medium text-gray-700 dark:text-gray-300 hover:text-bball-orange hover:bg-gray-100 dark:hover:bg-gray-700">
                    <i class="ph ph-shield mr-3 text-lg"></i>
                    Teams
                </a>
                <a href="/games" class="mobile-nav-link flex items-center px-3 py-2 rounded-md text-base font-medium text-gray-700 dark:text-gray-300 hover:text-bball-orange hover:bg-gray-100 dark:hover:bg-gray-700">
                    <i class="ph ph-trophy mr-3 text-lg"></i>
                    Games
                </a>
                <a href="/stats" class="mobile-nav-link flex items-center px-3 py-2 rounded-md text-base font-medium text-gray-700 dark:text-gray-300 hover:text-bball-orange hover:bg-gray-100 dark:hover:bg-gray-700">
                    <i class="ph ph-chart-bar mr-3 text-lg"></i>
                    Stats
                </a>
            </div>
        </div>
    </nav>
    
    <!-- HTMX Loading Indicator (Global) -->
    <div id="global-loading" class="htmx-indicator fixed top-0 left-0 right-0 z-50">
        <div class="h-1 bg-gradient-to-r from-bball-orange via-bball-orange-dark to-bball-orange animate-pulse"></div>
    </div>
    
    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Footer -->
    <footer class="bg-white dark:bg-bball-gray border-t dark:border-gray-700 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <div class="flex items-center space-x-2 mb-4 md:mb-0">
                    <i class="ph-fill ph-basketball text-bball-orange"></i>
                    <span class="text-sm text-gray-600 dark:text-gray-400">BBall Ref Local © 2026</span>
                </div>
                <div class="flex space-x-6 text-sm text-gray-500 dark:text-gray-400">
                    <a href="/docs" class="hover:text-bball-orange transition-colors">API Docs</a>
                    <a href="/health" class="hover:text-bball-orange transition-colors">Health</a>
                </div>
            </div>
        </div>
    </footer>
    
    <!-- Application JavaScript -->
    <script src="/static/js/app.js"></script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
