<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BBall Ref Local{% endblock %}</title>
    
    <!-- Tailwind CSS Configuration -->
    <script>
        window.tailwind = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'nba-blue': '#17408B',
                        'nba-blue-dark': '#1e4fad',
                        'nba-red': '#C9082A',
                        'nba-red-dark': '#a30622',
                        'bball-black': '#1A1A1A',
                        'bball-gray': '#2D2D2D',
                    }
                }
            }
        }
    </script>
    
    <!-- Tailwind CSS 4.1.18 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.18/dist/tailwind.min.js"></script>
    
    <!-- HTMX 2.0.8 -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
    
    <!-- Tabulator.js 6.3.1 CSS -->
    <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css">
    
    <!-- Tabulator.js 6.3.1 JS -->
    <script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
    
    <!-- Phosphor Icons 2.1.2 -->
    <script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/custom.css">
    
    <!-- HTMX Indicator CSS -->
    <style>
        /* HTMX Loading Indicator */
        .htmx-indicator {
            opacity: 0;
            transition: opacity 200ms ease-in-out;
        }
        .htmx-request .htmx-indicator {
            opacity: 1;
        }
        .htmx-request.htmx-indicator {
            opacity: 1;
        }
        
        /* Loading spinner */
        .htmx-loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(23, 64, 139, 0.3);
            border-radius: 50%;
            border-top-color: #17408B;
            animation: htmx-spin 1s ease-in-out infinite;
        }
        
        @keyframes htmx-spin {
            to { transform: rotate(360deg); }
        }
        
        /* Global Search Styles */
        #search-results:not(.hidden) {
            display: block;
        }
        
        #search-results .search-result-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid rgba(229, 231, 235, 0.5);
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        
        #search-results .search-result-item:hover {
            background-color: rgba(23, 64, 139, 0.1);
        }
        
        #search-results .search-result-item:last-child {
            border-bottom: none;
        }
        
        #search-results .search-icon {
            width: 2rem;
            height: 2rem;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 0.75rem;
            flex-shrink: 0;
        }
        
        #search-results .search-icon.player {
            background: linear-gradient(135deg, #17408B 0%, #1e4fad 100%);
            color: white;
        }
        
        #search-results .search-icon.team {
            background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
            color: white;
        }
        
        #search-results .search-icon.game {
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            color: white;
        }
        
        #search-results .search-info {
            flex: 1;
            min-width: 0;
        }
        
        #search-results .search-name {
            font-weight: 600;
            color: #111827;
            font-size: 0.875rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        #search-results .search-meta {
            font-size: 0.75rem;
            color: #6B7280;
        }
        
        #search-results .search-empty {
            padding: 2rem;
            text-align: center;
            color: #6B7280;
        }
        
        .dark #search-results .search-result-item {
            border-bottom-color: rgba(75, 85, 99, 0.5);
        }
        
        .dark #search-results .search-result-item:hover {
            background-color: rgba(23, 64, 139, 0.15);
        }
        
        .dark #search-results .search-name {
            color: #F9FAFB;
        }
        
        .dark #search-results .search-meta {
            color: #9CA3AF;
        }
        
        /* Hide scrollbar for category tabs */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
    
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-50 dark:bg-bball-black text-gray-900 dark:text-gray-100 min-h-screen flex flex-col transition-colors duration-200">
    <!-- Navigation Bar -->
    <nav class="bg-white dark:bg-bball-gray shadow-lg border-b-4 border-nba-blue">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <!-- Logo and Desktop Navigation -->
                <div class="flex items-center">
                    <a href="/" class="flex items-center space-x-2 group">
                        <i class="ph-fill ph-basketball text-3xl text-nba-blue group-hover:animate-bounce"></i>
                        <span class="font-bold text-xl hidden sm:block dark:text-white">BBall Ref</span>
                    </a>
                    
                    <!-- Desktop Menu -->
                    <div class="hidden md:flex ml-8 space-x-1">
                        <a href="/" class="nav-link flex items-center px-3 py-2 rounded-md text-sm font-medium text-gray-700 dark:text-gray-300 hover:text-nba-blue hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                            <i class="ph ph-house mr-1.5"></i>
                            Home
                        </a>
                        <a href="/players" class="nav-link flex items-center px-3 py-2 rounded-md text-sm font-medium text-gray-700 dark:text-gray-300 hover:text-nba-blue hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                            <i class="ph ph-users mr-1.5"></i>
                            Players
                        </a>
                        <a href="/api/v1/players/index" class="nav-link flex items-center px-3 py-2 rounded-md text-sm font-medium text-gray-700 dark:text-gray-300 hover:text-nba-blue hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                            <i class="ph ph-list-letters mr-1.5"></i>
                            Player Index
                        </a>
                        <a href="/teams" class="nav-link flex items-center px-3 py-2 rounded-md text-sm font-medium text-gray-700 dark:text-gray-300 hover:text-nba-blue hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                            <i class="ph ph-shield mr-1.5"></i>
                            Teams
                        </a>
                        <a href="/games" class="nav-link flex items-center px-3 py-2 rounded-md text-sm font-medium text-gray-700 dark:text-gray-300 hover:text-nba-blue hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                            <i class="ph ph-trophy mr-1.5"></i>
                            Games
                        </a>
                        <a href="/stats" class="nav-link flex items-center px-3 py-2 rounded-md text-sm font-medium text-gray-700 dark:text-gray-300 hover:text-nba-blue hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                            <i class="ph ph-chart-bar mr-1.5"></i>
                            Stats
                        </a>
                    </div>
                </div>
                
                <!-- Global Search -->
                <div class="hidden md:flex items-center mr-4">
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="ph ph-magnifying-glass text-gray-400"></i>
                        </div>
                        <input type="text"
                               id="global-search"
                               name="q"
                               placeholder="Search players, teams..."
                               hx-get="/api/v1/search"
                               hx-trigger="keyup changed delay:300ms, search"
                               hx-target="#search-results"
                               hx-indicator="#search-loading"
                               autocomplete="off"
                               class="w-64 pl-10 pr-4 py-2 bg-gray-100 dark:bg-gray-700 border border-transparent rounded-lg text-sm text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-nba-blue focus:bg-white dark:focus:bg-bball-gray focus:border-transparent transition-all">
                        <div id="search-loading" class="htmx-indicator absolute inset-y-0 right-0 pr-3 flex items-center">
                            <div class="htmx-loading w-4 h-4 border-2"></div>
                        </div>
                        <div id="search-results" class="hidden absolute top-full left-0 right-0 mt-2 bg-white dark:bg-bball-gray rounded-lg shadow-xl border border-gray-200 dark:border-gray-700 overflow-hidden z-50 max-h-80 overflow-y-auto">
                            <!-- Search results will be loaded here -->
                        </div>
                    </div>
                </div>

                <!-- Right side: Dark mode toggle and Mobile menu button -->
                <div class="flex items-center space-x-2">
                    <!-- Dark Mode Toggle -->
                    <button id="darkModeToggle" class="p-2 rounded-lg text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-nba-blue transition-colors" aria-label="Toggle dark mode">
                        <i id="darkModeIcon" class="ph-fill ph-moon text-xl"></i>
                    </button>
                    
                    <!-- Mobile menu button -->
                    <button id="mobileMenuBtn" class="md:hidden p-2 rounded-lg text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-nba-blue transition-colors" aria-label="Open menu">
                        <i id="mobileMenuIcon" class="ph ph-list text-2xl"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Mobile Navigation Menu -->
        <div id="mobileMenu" class="hidden md:hidden bg-white dark:bg-bball-gray border-t dark:border-gray-700">
            <div class="px-2 pt-2 pb-3 space-y-1">
                <a href="/" class="mobile-nav-link flex items-center px-3 py-2 rounded-md text-base font-medium text-gray-700 dark:text-gray-300 hover:text-nba-blue hover:bg-gray-100 dark:hover:bg-gray-700">
                    <i class="ph ph-house mr-3 text-lg"></i>
                    Home
                </a>
                <a href="/players" class="mobile-nav-link flex items-center px-3 py-2 rounded-md text-base font-medium text-gray-700 dark:text-gray-300 hover:text-nba-blue hover:bg-gray-100 dark:hover:bg-gray-700">
                    <i class="ph ph-users mr-3 text-lg"></i>
                    Players
                </a>
                <a href="/api/v1/players/index" class="mobile-nav-link flex items-center px-3 py-2 rounded-md text-base font-medium text-gray-700 dark:text-gray-300 hover:text-nba-blue hover:bg-gray-100 dark:hover:bg-gray-700">
                    <i class="ph ph-list-letters mr-3 text-lg"></i>
                    Player Index
                </a>
                <a href="/teams" class="mobile-nav-link flex items-center px-3 py-2 rounded-md text-base font-medium text-gray-700 dark:text-gray-300 hover:text-nba-blue hover:bg-gray-100 dark:hover:bg-gray-700">
                    <i class="ph ph-shield mr-3 text-lg"></i>
                    Teams
                </a>
                <a href="/games" class="mobile-nav-link flex items-center px-3 py-2 rounded-md text-base font-medium text-gray-700 dark:text-gray-300 hover:text-nba-blue hover:bg-gray-100 dark:hover:bg-gray-700">
                    <i class="ph ph-trophy mr-3 text-lg"></i>
                    Games
                </a>
                <a href="/stats" class="mobile-nav-link flex items-center px-3 py-2 rounded-md text-base font-medium text-gray-700 dark:text-gray-300 hover:text-nba-blue hover:bg-gray-100 dark:hover:bg-gray-700">
                    <i class="ph ph-chart-bar mr-3 text-lg"></i>
                    Stats
                </a>
            </div>
        </div>
    </nav>
    
    <!-- HTMX Loading Indicator (Global) -->
    <div id="global-loading" class="htmx-indicator fixed top-0 left-0 right-0 z-50">
        <div class="h-1 bg-gradient-to-r from-nba-blue via-nba-blue-dark to-nba-blue animate-pulse"></div>
    </div>
    
    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Footer -->
    <footer class="bg-white dark:bg-bball-gray border-t dark:border-gray-700 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <div class="flex items-center space-x-2 mb-4 md:mb-0">
                    <i class="ph-fill ph-basketball text-nba-blue"></i>
                    <span class="text-sm text-gray-600 dark:text-gray-400">BBall Ref Local © 2026</span>
                </div>
                <div class="flex space-x-6 text-sm text-gray-500 dark:text-gray-400">
                    <a href="/docs" class="hover:text-nba-blue transition-colors">API Docs</a>
                    <a href="/health" class="hover:text-nba-blue transition-colors">Health</a>
                </div>
            </div>
        </div>
    </footer>
    
    <!-- Application JavaScript -->
    <script src="/static/js/app.js"></script>
    
    <!-- Global Search JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('global-search');
            const searchResults = document.getElementById('search-results');
            
            if (searchInput && searchResults) {
                // Show results when typing
                searchInput.addEventListener('input', function() {
                    if (this.value.length > 0) {
                        searchResults.classList.remove('hidden');
                    } else {
                        searchResults.classList.add('hidden');
                    }
                });
                
                // Handle HTMX after swap - re-add click handlers
                document.body.addEventListener('htmx:afterSwap', function(evt) {
                    if (evt.detail.target.id === 'search-results') {
                        // Show results when content is loaded
                        if (searchInput.value.length > 0) {
                            searchResults.classList.remove('hidden');
                        }
                    }
                });
                
                // Close search when clicking outside
                document.addEventListener('click', function(evt) {
                    if (!searchInput.contains(evt.target) && !searchResults.contains(evt.target)) {
                        searchResults.classList.add('hidden');
                    }
                });
                
                // Focus input shows results if has value
                searchInput.addEventListener('focus', function() {
                    if (this.value.length > 0 && searchResults.innerHTML.trim() !== '') {
                        searchResults.classList.remove('hidden');
                    }
                });
                
                // Keyboard navigation
                searchInput.addEventListener('keydown', function(evt) {
                    if (evt.key === 'Escape') {
                        searchResults.classList.add('hidden');
                        this.blur();
                    }
                });
            }
        });
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
