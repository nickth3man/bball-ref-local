[project]
name = "bball-ref-local"
version = "0.1.0"
description = "Local basketball reference data API with FastAPI and DuckDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.3,<2.0.0",
    "fastapi[standard]>=0.115.0,<0.120.0",
    "jinja2>=3.1.4,<4.0.0",
    "nba-api>=1.11.3",
    "pandas>=2.2.3,<3.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "uvicorn[standard]>=0.32.0,<0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # Line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
